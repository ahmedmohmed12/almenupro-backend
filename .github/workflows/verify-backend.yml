name: Verify Backend Deploy Config

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Vercel entrypoints and routing
        run: node scripts/verifyVercelDeploy.js
